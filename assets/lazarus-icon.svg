<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#16202e"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee7ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3a4a60" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2a3345" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- page -->
  <path d="M136,72 H332 L376,116 V440 H136 Z" fill="url(#page)" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M332,72 V116 H376 Z" fill="#24324a" stroke="#5ee7ff" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>

  <!-- restored text, crisp and glowing -->
  <g stroke="#5ee7ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <line x1="168" y1="144" x2="300" y2="144"/>
    <line x1="168" y1="176" x2="344" y2="176"/>
    <line x1="168" y1="208" x2="330" y2="208"/>
    <line x1="168" y1="240" x2="344" y2="240"/>
  </g>

  <!-- transitional, coming back -->
  <g stroke="#5ee7ff" stroke-width="8" stroke-linecap="round" filter="url(#softglow)">
    <line x1="168" y1="272" x2="236" y2="272" stroke-opacity="0.75"/>
    <line x1="250" y1="272" x2="318" y2="272" stroke-opacity="0.6"/>
    <line x1="168" y1="304" x2="204" y2="304" stroke-opacity="0.45"/>
    <line x1="220" y1="304" x2="262" y2="304" stroke-opacity="0.35"/>
    <line x1="280" y1="304" x2="336" y2="304" stroke-opacity="0.4"/>
  </g>

  <!-- degraded, broken scan text -->
  <g stroke="#6b7a90" stroke-linecap="round">
    <line x1="168" y1="336" x2="186" y2="336" stroke-width="7" stroke-opacity="0.5"/>
    <line x1="198" y1="336" x2="222" y2="336" stroke-width="6" stroke-opacity="0.4"/>
    <line x1="240" y1="337" x2="252" y2="337" stroke-width="6" stroke-opacity="0.35"/>
    <line x1="268" y1="335" x2="300" y2="335" stroke-width="7" stroke-opacity="0.4"/>
    <line x1="316" y1="336" x2="330" y2="336" stroke-width="5" stroke-opacity="0.3"/>

    <line x1="168" y1="368" x2="178" y2="368" stroke-width="6" stroke-opacity="0.3"/>
    <line x1="196" y1="369" x2="214" y2="369" stroke-width="5" stroke-opacity="0.25"/>
    <line x1="236" y1="367" x2="244" y2="367" stroke-width="5" stroke-opacity="0.22"/>
    <line x1="262" y1="368" x2="290" y2="368" stroke-width="6" stroke-opacity="0.28"/>

    <line x1="172" y1="400" x2="180" y2="400" stroke-width="5" stroke-opacity="0.18"/>
    <line x1="210" y1="401" x2="222" y2="401" stroke-width="4" stroke-opacity="0.15"/>
    <line x1="254" y1="399" x2="260" y2="399" stroke-width="4" stroke-opacity="0.14"/>
    <line x1="296" y1="400" x2="312" y2="400" stroke-width="5" stroke-opacity="0.16"/>
  </g>

  <!-- fragments rising and reassembling -->
  <g fill="#5ee7ff" filter="url(#softglow)">
    <rect x="228" y="352" width="4" height="4" fill-opacity="0.35"/>
    <rect x="306" y="350" width="3" height="3" fill-opacity="0.3"/>
    <rect x="190" y="384" width="3" height="3" fill-opacity="0.25"/>
    <rect x="276" y="386" width="4" height="4" fill-opacity="0.25"/>
    <rect x="242" y="320" width="4" height="4" fill-opacity="0.5"/>
    <rect x="212" y="318" width="3" height="3" fill-opacity="0.45"/>
    <rect x="322" y="322" width="3" height="3" fill-opacity="0.45"/>
    <rect x="266" y="288" width="4" height="4" fill-opacity="0.65"/>
    <rect x="190" y="290" width="3" height="3" fill-opacity="0.6"/>
    <rect x="232" y="416" width="3" height="3" fill-opacity="0.15"/>
  </g>
</svg>
